syntax = "proto3";

package raftpb;

option go_package = "distributed-kv/proto/raftpb";

// Command is the envelope for any write applied through Raft.
// Reads bypass Raft entirely.
message Command {
    string request_id = 1;  // ULID, generated by API server (Phase 0.5b)
    Op     op         = 2;
    bytes  key        = 3;
    bytes  value      = 4;  // empty for OpDelete
}

enum Op {
    OP_UNSPECIFIED = 0;
    OP_PUT         = 1;
    OP_DELETE      = 2;
}