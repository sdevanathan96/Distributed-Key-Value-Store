syntax = "proto3";
package kv;
option go_package = "distributed-kv/proto/kvpb";

message PutRequest {
    bytes key = 1;
    bytes value = 2;
}
message PutResponse {
    bool success = 1;
}

message GetRequest {
    bytes key = 1;
}
message GetResponse {
    bytes value = 1;
    bool found = 2;
}

message DeleteRequest {
    bytes key = 1;
}
message DeleteResponse {
    bool success = 1;
}

message ClusterStatusRequest {}
// One entry per shard: each shard is its own Raft group with its own leader
// and term.
message ClusterStatusResponse {
    reserved 1, 2, 3; // single shard leader_id, nodes, term
    string node_id = 4; // the node that answered
    repeated ShardStatus shards = 5;
}

message ShardStatus {
    uint32 shard_id = 1;
    string leader_id = 2;
    repeated string nodes = 3;
    uint64 term = 4;
}

message LeaderHint {
    string client_addr = 1;
}

service KVService {
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc ClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
}